name: CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 pylint black mypy pytest

    - name: Run flake8
      run: flake8 src

    - name: Run black (check only)
      run: black --check src

    - name: Run pylint
      run: pylint src/app || true

    - name: Run mypy (optional)
      run: mypy src || true

    - name: Run tests
      run: pytest || true

    - name: Build Docker image
      run: docker build -t myfirstpyproj:latest .
