<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Поиск молекулы</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <h2>Добавить молекулу</h2>

  <div class="form">
    <input id="mol-name" type="text" placeholder="Название молекулы">
    <input id="mol-smiles" type="text" placeholder="SMILES">
    <button onclick="addMolecule()">Добавить</button>
    <div id="status-add"></div>
  </div>
  

<table id="molecules-table">
  <thead>
    <tr>
      <th>Название</th>
      <th>SMILES</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<div class="pagination">
  <button id="prev" onclick="prevPage()">Назад</button>
  <span id="page-info"></span>
  <button id="next" onclick="nextPage()">Вперёд</button>
</div>

<h2>Поиск молекулы</h2>

<section>
  <input id="search-query" placeholder="Введите SMILES" />
  <button onclick="search()">Искать</button>
  <ul id="search-results"></ul>
  <div id="status-search"></div>
</section>

<h2>Удалить молекулу</h2>

<div class="form">
  <input id="delete-input" placeholder="Введите название или SMILES">
  <button onclick="deleteMoleculeByInput()">Удалить</button>
  <div id="status-delete"></div>
</div>

<script src="/static/js/app.js"></script>
</body>
</html>
