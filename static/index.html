<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Molecules App</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<h1>🧪 Molecules Database</h1>

<section>
    <h2>➕ Добавить молекулу</h2>
    <form id="add-molecule-form">
        <input type="text" id="mol-id" placeholder="ID молекулы" required>
        <input type="text" id="mol-smiles" placeholder="SMILES" required>
        <button type="submit">Добавить</button>
    </form>
    <div id="add-status" class="status"></div>
</section>

<hr>

<section>
    <h2>📋 Список молекул</h2>
    <div id="molecules-list"></div>
    <div class="pagination">
        <button id="prev-page">←</button>
        <span id="page-info"></span>
        <button id="next-page">→</button>
    </div>
</section>

<hr>

<section>
    <h2>🔍 Субструктурный поиск</h2>
    <form id="search-form">
        <input type="text" id="substructure" placeholder="SMILES субструктуры" required>
        <button type="submit">Искать</button>
    </form>
    <div id="search-status" class="status"></div>
    <div id="search-results"></div>
</section>

<script src="/static/js/app.js"></script>
</body>
</html>
